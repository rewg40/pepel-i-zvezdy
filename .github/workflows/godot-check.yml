name: godot-check

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot 4.3
        run: |
          set -e
          curl -sSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version || true

      - name: Import project
        run: |
          timeout 900 godot --headless --path game --import 2>&1 | tee /tmp/import.log || true
          grep -E "ERROR|SCRIPT" /tmp/import.log | head -20 || echo "(ошибок импорта нет)"

      - name: Parse all scripts
        run: |
          : > /tmp/parse.log
          for f in $(find game/scripts game/tests -name '*.gd' | sort); do
            res="res://${f#game/}"
            out=$(timeout 120 godot --headless --path game --check-only --script "$res" 2>&1)
            if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then
              echo "### $res" >> /tmp/parse.log
              echo "$out" | grep -E "SCRIPT ERROR|Parse Error|at:" >> /tmp/parse.log
            else
              echo "ok   $res" >> /tmp/parse.log
            fi
          done
          cat /tmp/parse.log

      - name: Run checks
        run: |
          set +e
          timeout 600 godot --headless --path game --quit-after 30000 \
            --script res://tests/check.gd > /tmp/check.log 2>&1
          echo "exit=$?" >> /tmp/check.log
          cat /tmp/check.log

      - name: Render frames (software)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null 2>&1
          mkdir -p /tmp/movie
          timeout 900 xvfb-run -a godot --path game --resolution 640x360 \
            --rendering-driver opengl3 --fixed-fps 30 \
            --write-movie /tmp/movie/f.png --quit-after 60 > /tmp/render.log 2>&1
          echo "exit=$?" >> /tmp/render.log
          ls /tmp/movie | head -5 >> /tmp/render.log
          tail -20 /tmp/render.log
          mkdir -p ci
          i=0
          for f in $(ls /tmp/movie/*.png 2>/dev/null | awk 'NR==2 || NR==20 || NR==50'); do
            i=$((i+1))
            cp "$f" "ci/frame_$i.png"
          done
          ls -l ci || true

      - name: Build report
        if: always()
        run: |
          mkdir -p ci
          {
            echo "# Проверка движком"
            echo
            echo "Godot: \`$(godot --version 2>&1 | tail -1)\`"
            echo
            echo '## Разбор скриптов (`--check-only`)'
            echo '```'
            cat /tmp/parse.log 2>/dev/null || echo "(нет данных)"
            echo '```'
            echo '## Импорт проекта'
            echo '```'
            grep -E "ERROR|SCRIPT|WARNING" /tmp/import.log | head -40 || echo "(ошибок нет)"
            echo '```'
            echo '## tests/check.gd'
            echo '```'
            cat /tmp/check.log 2>/dev/null
            echo '```'
            echo '## Кадры из движка (software OpenGL)'
            echo
            if ls ci/frame_*.png >/dev/null 2>&1; then
              for f in ci/frame_*.png; do echo "![]($f)"; done
            fi
            echo '```'
            tail -12 /tmp/render.log 2>/dev/null || echo "(рендера не было)"
            echo '```'
          } > ci/report.md
          git config user.name "godot-check"
          git config user.email "godot-check@users.noreply.github.com"
          git add -A ci
          git commit -m "ci: отчёт проверки движком [skip ci]" || echo "нечего коммитить"
          git push || echo "push не удался"

      - name: Fail on errors
        if: always()
        run: |
          if grep -q "FAIL " /tmp/check.log 2>/dev/null; then
            echo "есть проваленные проверки"; exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error" /tmp/check.log /tmp/parse.log 2>/dev/null; then
            echo "есть ошибки скриптов"; exit 1
          fi
          if ! grep -q "итог" /tmp/check.log 2>/dev/null; then
            echo "тест не дошёл до конца"; exit 1
          fi
          echo "всё чисто"
